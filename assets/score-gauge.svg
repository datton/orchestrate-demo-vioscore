<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t d">
  <title id="t">Illustrative score gauge</title>
  <desc id="d">A semicircle gauge with a needle in the upper-middle range. Illustration only, not a real score.</desc>
  <rect width="400" height="260" rx="16" fill="#e9eff5"/>
  <path d="M60 200 A140 140 0 0 1 340 200" fill="none" stroke="#cdd8e3" stroke-width="26" stroke-linecap="round"/>
  <path d="M60 200 A140 140 0 0 1 250 70" fill="none" stroke="#5b3fd1" stroke-width="26" stroke-linecap="round"/>
  <path d="M250 70 A140 140 0 0 1 340 200" fill="none" stroke="#0a6e63" stroke-width="26" stroke-linecap="round" opacity="0.35"/>
  <line x1="200" y1="200" x2="262" y2="104" stroke="#0b1f3a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="14" fill="#0b1f3a"/>
  <text x="60" y="236" font-family="system-ui, sans-serif" font-size="14" fill="#4a5a6f" text-anchor="middle">Lower</text>
  <text x="340" y="236" font-family="system-ui, sans-serif" font-size="14" fill="#4a5a6f" text-anchor="middle">Higher</text>
  <text x="200" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f1b2d" text-anchor="middle">Illustration only, not a real score</text>
</svg>
