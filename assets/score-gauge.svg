<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="t d">
  <title id="t">Illustrative score gauge</title>
  <desc id="d">A ring-shaped gauge with a needle in the upper-middle range. Illustration only, not a real score.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3bd1"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient><linearGradient id="m" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4b3bd1"/><stop offset="1" stop-color="#9be8cf"/></linearGradient></defs>
  <rect width="400" height="260" rx="22" fill="#f0eefb"/>
  <circle cx="330" cy="40" r="46" fill="#9be8cf" opacity="0.5"/>
  <circle cx="60" cy="236" r="34" fill="#ff9d7a" opacity="0.45"/>
  <path d="M70 200 A130 130 0 0 1 330 200" fill="none" stroke="#d9d5ee" stroke-width="28" stroke-linecap="round"/>
  <path d="M70 200 A130 130 0 0 1 256 78" fill="none" stroke="url(#m)" stroke-width="28" stroke-linecap="round"/>
