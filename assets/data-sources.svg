<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 195" role="img" aria-labelledby="t d">
  <title id="t">From alternative data to a score</title>
  <desc id="d">Three kinds of input, rent payments, utility payments and subscription payments, feed a model, which produces a score. Conceptual diagram with synthetic examples.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3bd1"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient><linearGradient id="m" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4b3bd1"/><stop offset="1" stop-color="#9be8cf"/></linearGradient></defs>
  <rect width="480" height="195" rx="20" fill="#f0eefb"/>
  <g font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#16152b">
    <rect x="6" y="16" width="180" height="40" rx="12" fill="#ffffff" stroke="#4b3bd1" stroke-width="2"/>
    <text x="96" y="42" text-anchor="middle">Rent payments</text>
    <rect x="6" y="62" width="180" height="40" rx="12" fill="#ffffff" stroke="#4b3bd1" stroke-width="2"/>
    <text x="96" y="88" text-anchor="middle">Utility payments</text>
    <rect x="6" y="108" width="180" height="40" rx="12" fill="#ffffff" stroke="#4b3bd1" stroke-width="2"/>
    <text x="96" y="134" text-anchor="middle">Subscription payments</text>
    <rect x="232" y="42" width="92" height="76" rx="16" fill="#16152b"/>
    <text x="278" y="86" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Model</text>
    <rect x="368" y="42" width="100" height="76" rx="16" fill="url(#g)"/>
    <text x="418" y="86" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Score</text>
  </g>
  <g stroke="#55536b" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M186 36 C208 36 208 72 228 78"/><path d="M186 82 L228 82"/><path d="M186 128 C208 128 208 92 228 86"/><path d="M324 80 L364 80"/>
  </g>
  <g fill="#55536b"><path d="M230 80 l-8 -5 v10z"/><path d="M366 80 l-8 -5 v10z"/></g>
  <text x="240" y="180" font-family="system-ui, sans-serif" font-size="14" fill="#55536b" text-anchor="middle">Conceptual diagram. Examples are synthetic.</text>
</svg>
