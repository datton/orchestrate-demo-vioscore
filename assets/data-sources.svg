<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d">
  <title id="t">From alternative data to a score</title>
  <desc id="d">Three kinds of input, payment history, cash-flow patterns and utility records, feed a model, which produces a score. Conceptual diagram with synthetic examples.</desc>
  <rect width="640" height="260" rx="16" fill="#f7f9fb" stroke="#cdd8e3"/>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#0f1b2d">
    <rect x="24" y="30" width="170" height="52" rx="10" fill="#e9eff5" stroke="#0b5cad" stroke-width="2"/>
    <text x="109" y="62" text-anchor="middle">Payment history</text>
    <rect x="24" y="104" width="170" height="52" rx="10" fill="#e9eff5" stroke="#0b5cad" stroke-width="2"/>
    <text x="109" y="136" text-anchor="middle">Cash-flow patterns</text>
    <rect x="24" y="178" width="170" height="52" rx="10" fill="#e9eff5" stroke="#0b5cad" stroke-width="2"/>
    <text x="109" y="210" text-anchor="middle">Utility records</text>
    <rect x="260" y="80" width="130" height="100" rx="14" fill="#0b1f3a"/>
    <text x="325" y="136" text-anchor="middle" fill="#f7f9fb" font-weight="600">Model</text>
    <rect x="456" y="80" width="160" height="100" rx="14" fill="#5b3fd1"/>
    <text x="536" y="136" text-anchor="middle" fill="#ffffff" font-weight="600">Score</text>
  </g>
  <g stroke="#4a5a6f" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M194 56 C228 56 228 110 258 120"/>
    <path d="M194 130 L258 130"/>
    <path d="M194 204 C228 204 228 150 258 140"/>
    <path d="M390 130 L454 130"/>
  </g>
  <g fill="#4a5a6f"><path d="M258 130 l-9 -5 v10z"/><path d="M454 130 l-9 -5 v10z"/></g>
  <text x="320" y="250" font-family="system-ui, sans-serif" font-size="13" fill="#4a5a6f" text-anchor="middle">Conceptual diagram. Examples are synthetic.</text>
</svg>
