<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 255" role="img" aria-labelledby="t d">
  <title id="t">Synthetic score distribution</title>
  <desc id="d">A bar chart of an invented, synthetic population across five score bands, rising to a peak in the middle band and falling again. Not real data.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3bd1"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient><linearGradient id="m" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4b3bd1"/><stop offset="1" stop-color="#9be8cf"/></linearGradient></defs>
  <rect width="480" height="255" rx="20" fill="#f0eefb"/>
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#16152b">Synthetic, illustrative</text>
  <text x="20" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#55536b">Population by score band. Invented data.</text>
  <g stroke="#d9d5ee"><line x1="20" y1="195" x2="460" y2="195"/><line x1="20" y1="150" x2="460" y2="150"/><line x1="20" y1="105" x2="460" y2="105"/></g>
  <g fill="url(#g)">
    <rect x="34" y="160" width="60" height="35" rx="8"/>
    <rect x="116" y="125" width="60" height="70" rx="8"/>
    <rect x="198" y="70" width="60" height="125" rx="8"/>
    <rect x="280" y="112" width="60" height="83" rx="8"/>
    <rect x="362" y="158" width="60" height="37" rx="8"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#16152b" text-anchor="middle">
    <text x="64" y="217">Band 1</text><text x="146" y="217">Band 2</text><text x="228" y="217">Band 3</text><text x="310" y="217">Band 4</text><text x="392" y="217">Band 5</text>
    <text x="240" y="240" font-size="14" fill="#55536b">Lowest to highest band, left to right.</text>
  </g>
</svg>
